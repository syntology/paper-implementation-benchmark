# Every check in this repository, run against a FRESH CLONE, on every push
# and pull request.
#
# WHY THIS FILE EXISTS. On 2026-09-13 this tree did not import from a clean
# clone: 13 of the 18 modules in `src/` raised ModuleNotFoundError, and
# `requirements.txt` omitted `requests`, so no arm would start -- not even the
# credential-free floor. Both defects had been invisible for a month because
# every check had been run inside the working repository, where the missing
# modules resolve and every package is already installed. ASSEMBLY_REPORT.md
# 4.9 is the incident.
#
# So this workflow's whole job is to be the place where "it works on my
# machine" cannot be the answer. It checks out the repository the way a
# stranger gets it, installs from requirements.txt alone, and runs every gate
# that needs no credentials -- across five Python versions, because the runs
# were made on 3.14.6 and nobody else has that.
#
# THREE RULES IT KEEPS:
#   1. No step may be skipped silently. There is no `continue-on-error` and no
#      `if:` on a check step anywhere in this file, and the last step of each
#      job re-reads a ledger every check appends to and fails if one is
#      missing. A check that stops running must turn the build red, not
#      disappear from a green one.
#   2. Anything needing a graph, an API key or the working repo is skipped
#      VISIBLY, and where the refusal is deterministic it is PROVED rather
#      than asserted -- the tool is run and required to refuse with its
#      documented exit code (`tools/assemble.py --check` -> 2,
#      `analyze_substitution.py` -> KeyError NEO4J_URI, the `code_only` QC
#      gate -> 4, the project's "unresolved partials" code).
#   3. Every count has a floor. `verify_claims.py` exiting 0 with zero checks
#      run would be a green build that proved nothing, so the floors are
#      asserted here and have to be raised deliberately.
#
# WHAT IT DOES NOT PROVE: nothing here runs a subject model. The four arms
# need AWS Bedrock credentials (and the graph arms need a private Neo4j graph
# that is not published at all), so no number in README.md is regenerated by
# CI. What CI proves is that a stranger can install this repository and
# re-derive every published number from `data/` -- which is the claim
# REPRODUCTION.md actually makes.

name: checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # --------------------------------------------------------------------------
  # The supported matrix: every credential-free gate, five interpreters.
  # 3.10 is the floor because PEP 604 annotations (`str | None`) are evaluated
  # at import time in five modules -- see the `python-3-9-boundary` job, which
  # measures exactly where that bites rather than leaving the floor a claim.
  # --------------------------------------------------------------------------
  clean-clone:
    name: py${{ matrix.python }} ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          # The published runs were made on macOS with CPython 3.14.6. One leg
          # keeps that combination honest; the rest prove it is not required.
          - os: macos-latest
            python: "3.14"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: requirements.txt

      # The venv goes OUTSIDE the clone deliberately. tools/scan_secrets.py
      # walks the whole tree and skips `.venv`/`venv` BY NAME; a venv inside
      # the workspace under any other name puts site-packages in front of the
      # scanner (measured: 1,314 findings out of botocore's own test data).
      # Installing outside also proves the checks need nothing from the
      # working directory but the repository itself.
      - name: Install from requirements.txt alone, outside the clone
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/venv/bin/python" -m pip install -r requirements.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"
          : > "$RUNNER_TEMP/ran.txt"

      - name: Interpreter and installed requirements
        run: |
          python -VV
          python -c "import numpy, boto3, botocore, requests, neo4j; print('requirements import OK')"
          pip list

      # ---- the gate that would have caught the 2026-09-13 defect ------------
      - name: Clean-clone gate (compile, import, declared deps, manifest)
        run: |
          python tools/check_clean_clone.py | tee "$RUNNER_TEMP/ccc.log"
          grep -q "clean-clone check: CLEAN" "$RUNNER_TEMP/ccc.log"
          echo clean_clone >> "$RUNNER_TEMP/ran.txt"

      - name: Clean-clone gate self-test (it must be able to fail)
        run: |
          python tools/check_clean_clone.py --self-test | tee "$RUNNER_TEMP/ccc_self.log"
          grep -q "self-test: PASS" "$RUNNER_TEMP/ccc_self.log"
          echo clean_clone_self >> "$RUNNER_TEMP/ran.txt"

      # ---- the checks that already existed ---------------------------------
      - name: Referee smoke test (offline, $0)
        run: |
          python tools/smoke_referee.py | tee "$RUNNER_TEMP/smoke.log"
          grep -q "referee smoke: PASS" "$RUNNER_TEMP/smoke.log"
          n=$(grep -c '^  PASS  ' "$RUNNER_TEMP/smoke.log" || true)
          if [ "${n:-0}" -lt 3 ]; then
            echo "::error::smoke_referee scored ${n:-0} tasks; the floor is 3"
            exit 1
          fi
          echo smoke_referee >> "$RUNNER_TEMP/ran.txt"

      - name: Re-derive every published number from data/
        run: |
          python tools/verify_claims.py | tee "$RUNNER_TEMP/claims.log"
          grep -q ", 0 failed" "$RUNNER_TEMP/claims.log"
          n=$(sed -n 's/^\([0-9][0-9]*\) checks passed.*/\1/p' "$RUNNER_TEMP/claims.log")
          if [ "${n:-0}" -lt 67 ]; then
            echo "::error::verify_claims ran ${n:-0} checks; the floor is 67. Raise the floor deliberately, never let it fall."
            exit 1
          fi
          echo verify_claims >> "$RUNNER_TEMP/ran.txt"

      - name: Re-derive the 0.29-0.80 fidelity bracket from the audit rows
        run: |
          python tools/recompute_fidelity_bracket.py | tee "$RUNNER_TEMP/fid.log"
          grep -q ", 0 failed" "$RUNNER_TEMP/fid.log"
          n=$(sed -n 's/^\([0-9][0-9]*\) checks passed.*/\1/p' "$RUNNER_TEMP/fid.log")
          if [ "${n:-0}" -lt 41 ]; then
            echo "::error::recompute_fidelity_bracket ran ${n:-0} checks; the floor is 41"
            exit 1
          fi
          echo fidelity_bracket >> "$RUNNER_TEMP/ran.txt"

      - name: Secret scan
        run: |
          python tools/scan_secrets.py | tee "$RUNNER_TEMP/scan.log"
          grep -q "secret scan: CLEAN" "$RUNNER_TEMP/scan.log"
          echo scan_secrets >> "$RUNNER_TEMP/ran.txt"

      # The INTERNAL-exact half of this self-test needs BENCH_INTERNAL_*, which
      # only the publisher has. The tool prints `SKIPPED INTERNAL-exact` when
      # they are unset rather than reporting a pass it did not earn -- so the
      # skip is visible in this log, which is the point.
      - name: Secret scanner self-test (it must be able to fire)
        run: |
          python tools/scan_secrets.py --self-test | tee "$RUNNER_TEMP/scan_self.log"
          grep -q "self-test: PASS" "$RUNNER_TEMP/scan_self.log"
          grep -q "SKIPPED INTERNAL-exact" "$RUNNER_TEMP/scan_self.log" \
            || echo "note: INTERNAL-exact rules were configured in this run"
          echo scan_secrets_self >> "$RUNNER_TEMP/ran.txt"

      - name: Redactor self-test (it must be able to fire)
        run: |
          python tools/redact_transcripts.py --self-test | tee "$RUNNER_TEMP/red_self.log"
          grep -q "redactor self-test: PASS" "$RUNNER_TEMP/red_self.log"
          echo redactor_self >> "$RUNNER_TEMP/ran.txt"

      - name: Verify the 478 shipped transcripts carry no unredacted body
        run: |
          python tools/redact_transcripts.py --verify | tee "$RUNNER_TEMP/red_verify.log"
          grep -q "redacted-transcript verify: CLEAN" "$RUNNER_TEMP/red_verify.log"
          echo redactor_verify >> "$RUNNER_TEMP/ran.txt"

      # The ablation's load-bearing claim -- that the flat arm traverses no
      # relationship and reads no :Method or :Paper node -- is checks A and B,
      # and they run here with no index and no graph. C and D need an index, so
      # the tool exits 4 (unresolved partials) rather than reporting a pass.
      # Requiring exactly 4 is what makes that a visible skip instead of a
      # silent one: 0 would mean an index appeared, 1 means A or B failed.
      - name: code_only arm purity (A and B gate here; C and D need an index)
        run: |
          set +e
          python src/qc/qc_code_only_arm.py | tee "$RUNNER_TEMP/qc.log"
          rc=${PIPESTATUS[0]}
          set -e
          if [ "$rc" != "4" ]; then
            echo "::error::qc_code_only_arm exited $rc; expected 4 (checks C and D need a flat index, which CI has no licence to ship). 0 would mean an index appeared; 1 means arm purity or tokenizer parity FAILED."
            exit 1
          fi
          grep -q "PARTIAL" "$RUNNER_TEMP/qc.log"
          echo qc_code_only >> "$RUNNER_TEMP/ran.txt"

      # ---- what CI cannot run, named out loud and proved where provable -----
      - name: Declared skips - what needs credentials, and proof each refuses
        run: |
          echo "These need something CI does not have. None of them is silently skipped:"
          echo "  arms none/search      AWS Bedrock credentials (and a GitHub + Semantic Scholar key for search). ~\$0.06 per none-arm task; CI spends nothing."
          echo "  arms syntology/_ho    a PRIVATE Neo4j graph and unpublished serving code. Not runnable by anyone outside Syntology, CI included."
          echo "  arm  code_only        a flat index we have no licence to publish, plus a Neo4j store of :CodeSample nodes."
          echo "  analyze_substitution  a Neo4j session, opened before any table is computed."
          echo "  assemble.py --check   the working repo AND its internal directory names, which this repository deliberately does not carry."
          echo "  corpus_license_report the live graph."
          echo
          echo "Two of those refusals are deterministic, so they are proved, not asserted:"
          set +e
          python tools/assemble.py --check > "$RUNNER_TEMP/asm.log" 2>&1
          rc=$?
          set -e
          [ "$rc" = "2" ] || { echo "::error::assemble.py --check exited $rc; expected 2 (missing internal directory names)"; cat "$RUNNER_TEMP/asm.log"; exit 1; }
          grep -q "internal directory names" "$RUNNER_TEMP/asm.log"
          echo "  PROVED  assemble.py --check refuses with exit 2"
          set +e
          python src/analyze_substitution.py \
            --results data/results_v16.json --runs data/runs/runs_v16 \
            --holdout tasks/holdout_sets.json --tasks tasks/tasks_substitution.json \
            > "$RUNNER_TEMP/subs.log" 2>&1
          rc=$?
          set -e
          [ "$rc" != "0" ] || { echo "::error::analyze_substitution.py succeeded without NEO4J_URI -- REPRODUCTION.md says it cannot run here, so one of the two is now wrong"; exit 1; }
          grep -q "NEO4J_URI" "$RUNNER_TEMP/subs.log" || { echo "::error::analyze_substitution.py failed for some reason OTHER than the missing graph:"; tail -20 "$RUNNER_TEMP/subs.log"; exit 1; }
          echo "  PROVED  analyze_substitution.py refuses on the missing graph (KeyError: NEO4J_URI)"
          echo declared_skips >> "$RUNNER_TEMP/ran.txt"

      # A check that rewrites a published artifact has invalidated the tree it
      # just measured. `analyze_code_only_mechanism.py` defaults to writing
      # over data/mechanism_v15.json, and verify_claims.py runs it -- so this
      # is a real hazard, not a hypothetical one.
      - name: The checks changed nothing in the tree
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::a check wrote into the working tree:"
            git status --porcelain
            git diff --stat
            exit 1
          fi
          echo "  tree unchanged"
          echo tree_unchanged >> "$RUNNER_TEMP/ran.txt"

      # The anti-silent-skip ledger. If a step above is deleted, commented out,
      # or given an `if:` that evaluates false, its token is missing here and
      # this job fails -- which is the difference between a check that stopped
      # running and a check that stopped existing.
      - name: Every expected check actually ran
        run: |
          expected="clean_clone clean_clone_self smoke_referee verify_claims fidelity_bracket scan_secrets scan_secrets_self redactor_self redactor_verify qc_code_only declared_skips tree_unchanged"
          missing=""
          for c in $expected; do
            grep -qx "$c" "$RUNNER_TEMP/ran.txt" || missing="$missing $c"
          done
          if [ -n "$missing" ]; then
            echo "::error::these checks did not run:$missing"
            exit 1
          fi
          echo "all $(echo $expected | wc -w | tr -d ' ') checks ran:"
          cat "$RUNNER_TEMP/ran.txt"

  # --------------------------------------------------------------------------
  # The floor, measured rather than claimed.
  #
  # CPython 3.9 is still the system Python on macOS, and it is what the first
  # outside reader to clone this repository happened to run. On it the REFEREE
  # PATH WORKS -- smoke, verify_claims and the fidelity recompute all pass --
  # while five modules, `agent_harness.py` (the arm runner) among them, fail to
  # import on PEP 604 annotations evaluated at module load. That is a trap: a
  # reader can score submissions all day on 3.9 and then find that no arm
  # starts. So this job pins BOTH halves of the boundary, and turns red if
  # either moves. If someone adds `from __future__ import annotations` to those
  # five files, this job fails and tells you to lower the documented floor.
  # --------------------------------------------------------------------------
  python-3-9-boundary:
    name: "3.9 boundary: referee runs, arms do not"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Install
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/venv/bin/python" -m pip install -r requirements.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: The referee path DOES work on 3.9
        run: |
          python -VV
          python tools/smoke_referee.py | tee "$RUNNER_TEMP/s.log"
          grep -q "referee smoke: PASS" "$RUNNER_TEMP/s.log"
          python tools/verify_claims.py | tee "$RUNNER_TEMP/c.log"
          grep -q ", 0 failed" "$RUNNER_TEMP/c.log"
          python tools/recompute_fidelity_bracket.py | tee "$RUNNER_TEMP/f.log"
          grep -q ", 0 failed" "$RUNNER_TEMP/f.log"

      - name: The arms do NOT import on 3.9, and that is the documented floor
        run: |
          set +e
          python tools/check_clean_clone.py > "$RUNNER_TEMP/ccc39.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/ccc39.log"
          if [ "$rc" = "0" ]; then
            echo "::error::the whole tree now imports on 3.9. That is good news and it makes the documented floor (3.10) wrong: lower it in README.md and REPRODUCTION.md, move 3.9 into the supported matrix, and delete this job."
            exit 1
          fi
          grep -q "shipped module does not import: src/agent_harness.py" "$RUNNER_TEMP/ccc39.log" \
            || { echo "::error::3.9 fails for a reason other than the known PEP 604 import boundary -- read the log above before trusting the floor"; exit 1; }
          echo "  boundary confirmed: the referee scores on 3.9, the arm runner does not import"

  # --------------------------------------------------------------------------
  # The Windows reader, measured on a Linux runner.
  #
  # This repository hashes itself: MANIFEST.json records the sha256 of all
  # 1,273 files and tools/check_clean_clone.py compares the clone against them
  # byte for byte. Git's end-of-line conversion therefore looks exactly like
  # corruption. MEASURED 2026-09-13, before .gitattributes existed:
  #
  #     git -c core.autocrlf=true clone <repo>   ->  clean-clone check: 1272 FINDINGS
  #
  # and `core.autocrlf=true` is the Git-for-Windows INSTALLER DEFAULT, so that
  # is what a Windows reader gets by doing nothing. Every other gate passed on
  # that clone -- verify_claims, smoke_referee, the redaction verify, the
  # secret scan -- so the only thing that broke was the one check whose job is
  # to say the clone is intact. There is no Windows leg in the matrix above and
  # there does not need to be: the conversion is done by git on checkout, and
  # a Linux runner can ask for it explicitly.
  #
  # The second step is the mutation test. A green first step proves nothing on
  # its own -- it would also be green if git had stopped converting, or if the
  # gate had stopped comparing -- so the file is deleted and the failure is
  # required, with the diagnosis in it.
  # --------------------------------------------------------------------------
  crlf-checkout:
    name: "a core.autocrlf=true clone still matches MANIFEST.json"
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # the steps below re-clone FROM this checkout
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet --upgrade pip
          "$RUNNER_TEMP/venv/bin/python" -m pip install --quiet -r requirements.txt
          echo "$RUNNER_TEMP/venv/bin" >> "$GITHUB_PATH"

      - name: A Git-for-Windows-default clone matches the manifest
        run: |
          git -c core.autocrlf=true clone --quiet "$GITHUB_WORKSPACE" "$RUNNER_TEMP/crlf"
          python tools/check_clean_clone.py --root "$RUNNER_TEMP/crlf" | tee "$RUNNER_TEMP/crlf.log"
          grep -q "clean-clone check: CLEAN" "$RUNNER_TEMP/crlf.log"

      - name: ... and WITHOUT .gitattributes it does not, with the reason named
        run: |
          git clone --quiet "$GITHUB_WORKSPACE" "$RUNNER_TEMP/noattr"
          git -C "$RUNNER_TEMP/noattr" rm -q .gitattributes
          git -C "$RUNNER_TEMP/noattr" -c user.email=ci@local -c user.name=ci \
              commit -q -m "mutation: drop .gitattributes"
          git -c core.autocrlf=true clone --quiet "$RUNNER_TEMP/noattr" "$RUNNER_TEMP/crlf_bad"
          set +e
          python tools/check_clean_clone.py --root "$RUNNER_TEMP/crlf_bad" > "$RUNNER_TEMP/bad.log" 2>&1
          rc=$?
          set -e
          cat "$RUNNER_TEMP/bad.log"
          if [ "$rc" != "1" ]; then
            echo "::error::without .gitattributes a core.autocrlf=true clone still passed (exit $rc). Either git stopped converting line endings or the manifest gate stopped comparing bytes -- until you know which, the step above is not evidence of anything."
            exit 1
          fi
          grep -q "line endings converted on checkout" "$RUNNER_TEMP/bad.log" || {
            echo "::error::the gate failed, but not with the line-ending diagnosis. A reader in this situation gets a wall of 'sha256 drift' and no way to tell a converted checkout from a corrupted one."
            exit 1
          }
          echo "  PROVED  .gitattributes is what makes the step above pass"

      - name: The gate's own self-test covers both of those classes
        run: |
          python tools/check_clean_clone.py --self-test | tee "$RUNNER_TEMP/self.log"
          grep -q "self-test: PASS" "$RUNNER_TEMP/self.log"
          grep -q "MANIFEST-crlf" "$RUNNER_TEMP/self.log"
          grep -q "decoy cwd" "$RUNNER_TEMP/self.log"

  # --------------------------------------------------------------------------
  # The machine-readable half: metadata a tool consumes, validated by the tools
  # that consume it. A CITATION.cff with one wrong field renders nothing on
  # GitHub and fails silently, which is the same defect class as everything
  # else in this file.
  # --------------------------------------------------------------------------
  metadata:
    name: CITATION.cff and the published JSON Schemas
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Two venvs, not one: cffconvert pins jsonschema < 4 and the schemas here
      # are draft 2020-12, which needs jsonschema >= 4.18. Resolving them
      # together would silently downgrade the validator.
      - name: Validate CITATION.cff against the CFF 1.2.0 schema
        run: |
          python -m venv "$RUNNER_TEMP/cff"
          "$RUNNER_TEMP/cff/bin/pip" install --quiet cffconvert
          "$RUNNER_TEMP/cff/bin/cffconvert" --validate
          "$RUNNER_TEMP/cff/bin/cffconvert" -f apalike

      - name: Validate the shipped artifacts against schemas/
        run: |
          python -m venv "$RUNNER_TEMP/js"
          "$RUNNER_TEMP/js/bin/pip" install --quiet "jsonschema>=4.18"
          "$RUNNER_TEMP/js/bin/python" tools/validate_schemas.py | tee "$RUNNER_TEMP/schema.log"
          grep -q "schema validation: CLEAN" "$RUNNER_TEMP/schema.log"
